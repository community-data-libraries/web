[build]
  command = "rm -rf .backend-canonical && git clone --depth 1 https://github.com/community-data-libraries/backend.git .backend-canonical && BACKEND_ROOT=.backend-canonical npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # The secrets scan fails a build whose output contains any environment variable's
  # value. These are public, not credentials, and are expected in the output:
  # - GITHUB_REPO: the repo identifier (owner/name).
  # - SITE_ORIGIN: the main site's address. It appears in the library-host edge
  #   function, which is deployed with its source (comments included).
  # - PUBLIC_MAIN_SITE_URL, PUBLIC_LIBRARY_DOMAIN: built into the pages on purpose.
  # - PUBLIC_POSTHOG_KEY, PUBLIC_ANALYTICS_CONSENT: the analytics project key is a
  #   public write-only token that browsers must have (docs/technical/analytics.md).
  SECRETS_SCAN_OMIT_KEYS = "GITHUB_REPO,SITE_ORIGIN,PUBLIC_MAIN_SITE_URL,PUBLIC_LIBRARY_DOMAIN,PUBLIC_POSTHOG_KEY,PUBLIC_ANALYTICS_CONSENT"

# ── Form submission webhook ──────────────────────────────────────────────────
# Triggers the submission-notify function whenever a new form submission
# arrives from the "resource-submission" Netlify Form.
[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Usage analytics proxy ────────────────────────────────────────────────────
# PostHog requests go through our own domain (/cdl-relay, see
# src/lib/analytics/core.ts) so school networks and blockers don't drop them.
# US region; for an EU project use eu-assets.i.posthog.com / eu.i.posthog.com.
# These must stay above the /web/* rewrite. docs/technical/analytics.md
[[redirects]]
  from = "/cdl-relay/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/cdl-relay/array/*"
  to = "https://us-assets.i.posthog.com/array/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/cdl-relay/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true

# Librarian edit pages: one static page serves every library (it reads the slug
# from the address), so libraries registered after the last build can be edited.
# Must come before the /web/* rewrite below.
[[redirects]]
  from = "/web/librarian/:slug/edit/*"
  to = "/librarian/edit/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/web/"
  status = 302

# Netlify ignores trailing slashes when matching rules, so a "/web" -> "/web/"
# redirect also matches "/web/" and loops forever (the broken Home link).
# "/web/*" already covers both "/web" and "/web/" (they rewrite to "/").
[[redirects]]
  from = "/web/*"
  to = "/:splat"
  status = 200
